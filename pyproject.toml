[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-memory"
version = "0.1.0"
description = "A local-first research memory for indexing, finding, and working with personal PDF libraries."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Research Memory Contributors"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24,<2.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.4,<2.0",
  "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6.0"]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
research-memory = "research_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_memory = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
