[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-memory"
version = "0.2.0"
description = "A local-first research memory for indexing, finding, and working with personal PDF libraries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Research Memory Contributors"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30,<5.0",
  "pypdf>=5.4,<7.0",
  "pillow>=11.0,<13.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.4,<2.0",
  "pydantic-settings>=2.2,<3.0",
  "cryptography>=48.0.1,<49",
]

[project.optional-dependencies]
semantic = [
  "fastembed>=0.7,<1.0",
  "onnxruntime>=1.17,<1.24",
  "usearch>=2.15,<3.0",
]
desktop = [
  "pip>=26.1.2,<27.0",
  "pyinstaller>=6.15,<7.0",
  "wheel>=0.45,<1.0",
]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pip-audit>=2.7,<3.0",
  "pip-tools>=7.4,<8.0",
  "reportlab>=4.2,<5.0",
]

[project.scripts]
research-memory = "research_memory.cli:main"
research-memory-core = "research_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_memory = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
packages = ["research_memory"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
