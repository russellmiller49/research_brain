name: Release macOS beta

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Signed update channel
        required: true
        type: choice
        options: [internal, beta]

permissions:
  contents: write

jobs:
  signed-beta:
    runs-on: macos-15
    environment: macos-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native release runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          environment-file: packaging/tesseract-osx-arm64.lock
          environment-name: research-memory-tesseract
          micromamba-version: "2.6.2-1"
          cache-environment: true
          post-cleanup: all
      - uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build pinned dylibbundler
        run: |
          scripts/install-dylibbundler.sh "$RUNNER_TEMP/dylibbundler-bin"
          echo "$RUNNER_TEMP/dylibbundler-bin" >> "$GITHUB_PATH"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci
        working-directory: desktop
      - run: python scripts/validate_taxonomy_catalog.py
      - run: python scripts/generate_taxonomy_types.py --check
      - run: ruff check src tests scripts
      - run: pytest
      - run: npm test
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: pip-audit -r requirements.lock --no-deps
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop
      - run: rustup run 1.97.1 cargo install cargo-audit --locked --version 0.22.2
      - run: rustup run 1.97.1 cargo audit
        working-directory: desktop/src-tauri
      - name: Prepare pinned Rust inventory
        working-directory: desktop/src-tauri
        run: |
          rustup run 1.97.1 cargo metadata \
            --locked \
            --format-version 1 \
            --filter-platform aarch64-apple-darwin \
            > "$RUNNER_TEMP/research-memory-cargo-metadata.json"
          echo "RESEARCH_MEMORY_CARGO_METADATA=$RUNNER_TEMP/research-memory-cargo-metadata.json" >> "$GITHUB_ENV"
      - name: Retain audited tooling path
        run: echo "RESEARCH_MEMORY_PIP_AUDIT=$(command -v pip-audit)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-release.lock
      - name: Install patched release Python
        run: |
          release_version="$(cat .python-release-version)"
          uv python install "$release_version" --managed-python
          release_python="$(uv python find "$release_version" --managed-python)"
          echo "RESEARCH_MEMORY_RELEASE_PYTHON=$release_python" >> "$GITHUB_ENV"
      - name: Prepare production Python inventory
        run: scripts/install-release-python.sh "$RUNNER_TEMP/release-python"
        env:
          PYTHON_BIN: ${{ env.RESEARCH_MEMORY_RELEASE_PYTHON }}
      - name: Audit production Python inventory
        run: |
          release_site="$("$RUNNER_TEMP/release-python/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          "$RESEARCH_MEMORY_PIP_AUDIT" --path "$release_site"
      - run: mkdir -p artifacts
      - run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/check_licenses.py --output artifacts/licenses.json
      - run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/generate_sbom.py --output artifacts/sbom-complete.cdx.json
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: dependency_scan
        with:
          sbom: artifacts/sbom-complete.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
      - run: cp "$DEPENDENCY_SCAN_REPORT" artifacts/vulnerabilities.json
        env:
          DEPENDENCY_SCAN_REPORT: ${{ steps.dependency_scan.outputs.json }}
      - run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/fetch-offline-model.py
      - run: scripts/build-sidecar.sh
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          PYTHON_BIN: ${{ runner.temp }}/release-python/bin/python
          RESEARCH_MEMORY_BUNDLE_IDENTIFIER: ${{ vars.BUNDLE_IDENTIFIER }}
      - run: scripts/package-tesseract.sh
        shell: micromamba-shell {0}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERIFY_PYTHON: ${{ runner.temp }}/release-python/bin/python
      - run: python scripts/write_release_config.py "$RUNNER_TEMP/release-config.json"
        env:
          RESEARCH_MEMORY_BUNDLE_IDENTIFIER: ${{ vars.BUNDLE_IDENTIFIER }}
          RESEARCH_MEMORY_UPDATE_ENDPOINT: ${{ vars.UPDATE_ENDPOINT }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      - run: npm run tauri build -- --config "$RUNNER_TEMP/release-config.json"
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/verify_release_artifact.sh
        env:
          EXPECTED_BUNDLE_IDENTIFIER: ${{ vars.BUNDLE_IDENTIFIER }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-memory-${{ inputs.channel }}-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            artifacts/licenses.json
            artifacts/sbom-complete.cdx.json
            artifacts/vulnerabilities.json
            packaging/tesseract-osx-arm64.lock
            packaging/tesseract-components.json
            packaging/macos-release-constraints.txt
            requirements-release.lock
          if-no-files-found: error
      - name: Publish downloadable macOS beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          version="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          tag="v${version}-${RELEASE_CHANNEL}.${GITHUB_RUN_NUMBER}"
          flags=()
          if [[ "$RELEASE_CHANNEL" == "internal" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" \
            desktop/src-tauri/target/release/bundle/dmg/*.dmg \
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz \
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig \
            --title "Research Memory ${version} ${RELEASE_CHANNEL}" \
            --notes "Apple-silicon macOS beta build. Requires macOS 13 or newer." \
            "${flags[@]}"
