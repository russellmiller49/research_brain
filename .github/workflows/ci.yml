name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/research_memory
      - run: pytest --cov=research_memory --cov-report=xml --cov-report=term-missing
      - run: pip check

  desktop:
    name: React desktop
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop

  rust:
    name: Rust boundary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  supply-chain:
    name: Security, licenses, and SBOM
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native release inventory runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Retain audited tooling path
        run: echo "RESEARCH_MEMORY_PIP_AUDIT=$(command -v pip-audit)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: desktop
      - run: mkdir -p artifacts
      - run: pip-audit -r requirements.lock --format cyclonedx-json --output artifacts/sbom-python.cdx.json
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop
      - run: npm sbom --sbom-format cyclonedx > ../artifacts/sbom-node.cdx.json
        working-directory: desktop
      - run: rustup run 1.97.1 cargo install cargo-audit --locked --version 0.22.2
      - run: rustup run 1.97.1 cargo audit
        working-directory: desktop/src-tauri
      - name: Prepare pinned Rust inventory
        working-directory: desktop/src-tauri
        run: |
          rustup run 1.97.1 cargo metadata \
            --locked \
            --format-version 1 \
            --filter-platform aarch64-apple-darwin \
            > "$RUNNER_TEMP/research-memory-cargo-metadata.json"
          echo "RESEARCH_MEMORY_CARGO_METADATA=$RUNNER_TEMP/research-memory-cargo-metadata.json" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-release.lock
      - name: Install patched release Python
        run: |
          release_version="$(cat .python-release-version)"
          uv python install "$release_version" --managed-python
          release_python="$(uv python find "$release_version" --managed-python)"
          echo "RESEARCH_MEMORY_RELEASE_PYTHON=$release_python" >> "$GITHUB_ENV"
      - name: Prepare production Python inventory
        run: scripts/install-release-python.sh "$RUNNER_TEMP/release-python"
        env:
          PYTHON_BIN: ${{ env.RESEARCH_MEMORY_RELEASE_PYTHON }}
      - name: Audit production Python inventory
        run: |
          release_site="$("$RUNNER_TEMP/release-python/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          "$RESEARCH_MEMORY_PIP_AUDIT" --path "$release_site"
      - run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/check_licenses.py --output artifacts/licenses.json
      - run: |
          "$RUNNER_TEMP/release-python/bin/python" scripts/generate_sbom.py --output artifacts/sbom-complete.cdx.json
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: dependency_scan
        with:
          sbom: artifacts/sbom-complete.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
      - run: cp "$DEPENDENCY_SCAN_REPORT" artifacts/vulnerabilities.json
        env:
          DEPENDENCY_SCAN_REPORT: ${{ steps.dependency_scan.outputs.json }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-bill-of-materials
          path: artifacts/
